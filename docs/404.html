<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Hell's Castle: Expediente Sombrio</title>
    <script>
        // O GitHub Pages serve este arquivo em qualquer caminho inexistente, então um link
        // relativo quebraria em subpastas: o destino é a raiz do site (com o nome do repositório
        // quando hospedado em *.github.io).
        (function () {
            var repo = location.pathname.split('/')[1];
            var isProjectSite = /\.github\.io$/.test(location.hostname) && repo;
            location.replace(isProjectSite ? '/' + repo + '/' : '/');
        })();
    </script>
</head>
<body>
    <noscript><p>Página não encontrada. <a href="/">Voltar ao jogo</a>.</p></noscript>
</body>
</html>
